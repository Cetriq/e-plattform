name: Fetch from SVN-repo

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
  # At 01:00 every night (Please note: GitHub actions schedule is in UTC time).
    - cron: "0 1 * * *"

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Imported code is proposed as a pull request and reviewed before it
    # reaches main, because every push to main deploys the central demo.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Install subversion
        run: sudo apt-get install subversion
      - name: Checkout current repo
        uses: actions/checkout@v4
      - name: Checkout SVN repo
        run: svn co svn://svn.nordicpeak.com/openeplatform
      - name: Open pull request with changes
        uses: peter-evans/create-pull-request@v7
        with:
          branch: svn-sync
          delete-branch: true
          commit-message: Import changes from the Open-ePlatform SVN repository
          title: Import changes from the Open-ePlatform SVN repository
          body: |
            Automatic import from svn://svn.nordicpeak.com/openeplatform.
            Review before merging: merging to main deploys the central demo.
          labels: svn-import

  # Prevents this action from being disabled due to repository inactivity. See: https://docs.github.com/en/actions/administering-github-actions/usage-limits-billing-and-administration#disabling-and-enabling-workflows
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
