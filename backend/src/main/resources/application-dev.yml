spring:
  # Database
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eplatform}
    username: ${SPRING_DATASOURCE_USERNAME:eplatform}
    password: ${SPRING_DATASOURCE_PASSWORD:devpassword}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # JPA
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # DevTools
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# MinIO
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket:
    attachments: eplatform-attachments
    exports: eplatform-exports

# Logging (more verbose in dev)
logging:
  level:
    se.eplatform: DEBUG
    org.springframework.security: DEBUG

# Insecure signing key for local development only; set JWT_SECRET everywhere else
eplatform:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
