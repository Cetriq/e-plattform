spring:
  # Database
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eplatform}
    # The application role, bound by row level security (V14); see
    # docker/postgres/init/02-app-role.sql
    username: ${SPRING_DATASOURCE_USERNAME:eplatform_app}
    password: ${SPRING_DATASOURCE_PASSWORD:app-dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # Migrations run as the role that owns the tables
  flyway:
    user: ${SPRING_FLYWAY_USER:eplatform}
    password: ${SPRING_FLYWAY_PASSWORD:${DB_PASSWORD:devpassword}}

  # JPA
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # DevTools
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# MinIO
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket:
    attachments: eplatform-attachments
    exports: eplatform-exports

# Logging (more verbose in dev)
logging:
  level:
    se.eplatform: DEBUG
    org.springframework.security: DEBUG

# Insecure signing key for local development only; set JWT_SECRET everywhere else
eplatform:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
  # Matches docker/postgres/init/01-retention-role.sql
  retention:
    datasource:
      password: ${RETENTION_DB_PASSWORD:retention-dev}
