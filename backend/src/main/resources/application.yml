spring:
  application:
    name: eplatform-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

  # Servlet
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    # Only check the mail server when e-mail is actually sent
    mail:
      enabled: ${EMAIL_ENABLED:false}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Response time percentiles for the IT/drift status page
      percentiles:
        http.server.requests: 0.95

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    filter: true
    show-extensions: true
  show-actuator: false
  packages-to-scan: se.eplatform
  paths-to-match: /api/**

# Server
server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  # Use X-Forwarded-For/-Proto only as set by the trusted reverse proxy in front of the API
  forward-headers-strategy: native
  error:
    # Error details come from GlobalExceptionHandler; never leak internal messages
    include-message: never
    include-binding-errors: never

# Logging
logging:
  level:
    root: INFO
    se.eplatform: DEBUG
    org.springframework.web: INFO
    # SQL logging with bound parameters would write personal data to the log;
    # enable it locally in application-dev.yml if needed
    org.hibernate.SQL: WARN

# Mail configuration
spring.mail:
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:1025}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail.smtp.auth: false
    mail.smtp.starttls.enable: false

# Thymeleaf
spring.thymeleaf:
  prefix: classpath:/templates/
  suffix: .html
  mode: HTML
  encoding: UTF-8
  cache: false

# Application specific
eplatform:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8080
  security:
    jwt:
      # HS256 signing key, at least 32 bytes. Required; the dev profile has a default.
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:eplatform}
      # Token lifetime in seconds (default 8 hours)
      expiration: ${JWT_EXPIRATION:28800}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      requests-per-minute: 100
      auth-requests-per-minute: 10
      upload-requests-per-minute: 20
  retention:
    # Drafts that were never submitted are removed after this many days
    draft-days: ${RETENTION_DRAFT_DAYS:90}
    # The traceability log is kept this many months
    audit-months: ${RETENTION_AUDIT_MONTHS:24}
    # The technical system log is kept this many days
    system-event-days: ${RETENTION_SYSTEM_EVENT_DAYS:90}
  demo:
    # Shared code visitors must enter before they can log in. Empty = no code.
    access-code: ${DEMO_ACCESS_CODE:}
    # Give each visitor who logs in as a citizen their own, new account
    isolated-citizens: ${DEMO_ISOLATED_CITIZENS:false}
    # Remove demo citizens and their cases after this many days (0 = keep)
    retention-days: ${DEMO_RETENTION_DAYS:7}
  email:
    enabled: ${EMAIL_ENABLED:false}
    from-address: ${EMAIL_FROM:noreply@eplatform.se}
    from-name: e-Plattform
    base-url: ${EMAIL_BASE_URL:http://localhost:3000}
  upload:
    max-file-size: 52428800  # 50MB
    max-filename-length: 255
