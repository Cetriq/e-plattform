services:
  # ===================
  # DATABASER
  # ===================

  postgres:
    image: postgres:16-alpine
    container_name: eplatform-db
    environment:
      POSTGRES_DB: eplatform
      POSTGRES_USER: eplatform
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eplatform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eplatform-network

  # ===================
  # FILLAGRING
  # ===================

  minio:
    image: minio/minio:latest
    container_name: eplatform-files
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - eplatform-network

  # ===================
  # E-POST (utveckling)
  # ===================

  mailpit:
    image: axllent/mailpit:latest
    container_name: eplatform-mail
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - eplatform-network

  # ===================
  # BACKEND
  # ===================

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: eplatform-api
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eplatform
      SPRING_DATASOURCE_USERNAME: eplatform
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-devpassword}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      EMAIL_ENABLED: "true"
      EMAIL_FROM: noreply@eplatform.se
      EMAIL_BASE_URL: http://localhost:3000
      DEMO_ACCESS_CODE: ${DEMO_ACCESS_CODE:-}
      DEMO_ISOLATED_CITIZENS: ${DEMO_ISOLATED_CITIZENS:-false}
    volumes:
      - ./backend/src:/app/src:delegated
      - gradle_cache:/root/.gradle
    ports:
      - "8080:8080"
      - "5005:5005"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - eplatform-network

  # ===================
  # FRONTEND
  # ===================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: eplatform-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:8080/graphql
    volumes:
      - ./frontend/src:/app/src:delegated
      - ./frontend/public:/app/public:delegated
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - eplatform-network

  # ===================
  # OBSERVABILITET
  # ===================

  prometheus:
    image: prom/prometheus:latest
    container_name: eplatform-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - eplatform-network

  grafana:
    image: grafana/grafana:latest
    container_name: eplatform-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - eplatform-network

networks:
  eplatform-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  gradle_cache:
  frontend_node_modules:
  frontend_next_cache:
